#################################
#       Shadow Settings         #
#################################
shadow = true;
shadow-radius = 10;
shadow-offset-x = -10;
shadow-offset-y = -10;
shadow-color = "#000000"
shadow-exclude = [
    "window_type = 'popup_menu'",
    "window_type = 'dropdown_menu'",
    "window_type = 'menu'",
    "window_type = 'tooltip'"
];

#################################
#           Fading              #
#################################
# Disabled entirely — fading on map/unmap is a major contributor to
# perceived latency on group switches in Qtile.
fading = false;

#################################
#         Transparency          #
#################################
inactive-opacity = 1;
active-opacity = 1.0;
frame-opacity = 0.7;
inactive-opacity-override = false;

popup_menu = { opacity = 0.8; }
dropdown_menu = { opacity = 0.8; }

opacity-rule = [
    "80:class_g     = 'Bar'",
    "100:class_g    = 'slop'",
    "100:class_g    = 'XTerm'",
    "100:class_g    = 'URxvt'",
    "70:class_g     = 'st'",
    "100:class_g    = 'Alacritty'",
    "80:class_g     = 'Polybar'",
    "100:class_g    = 'code-oss'",
    "100:class_g    = 'Meld'",
    "100:class_g    = 'TelegramDesktop'",
    "90:class_g     = 'Joplin'",
    "100:class_g    = 'Thunderbird'",
];

focus-exclude = [
    "class_g = 'Cairo-clock'",
    "class_g = 'Bar'",
    "class_g = 'slop'"
];

#################################
#         Corner Radius         #
#################################
corner-radius = 10.0;
round-borders = 1;
rounded-corners-exclude = [
    "class_g = 'awesome'",
    "class_g = 'URxvt'",
    "class_g = 'XTerm'",
    "class_g = 'Polybar'",
    "class_g = 'code-oss'",
    "class_g = 'Thunderbird'"
];

round-borders-exclude = [];

#################################
#        Background Blur        #
#################################
# Kept dual_kawase (fastest blur picom offers) but reduced strength.
# Strength 10 was doing a lot of per-frame GPU work during redraws;
# 3 looks visually similar for most wallpapers and is dramatically cheaper.
blur: {
	  method = "dual_kawase";
	  strength = 3;
      };

blur-background = true;
# Disabled frame blur — this forces picom to blur the region behind every
# window frame separately, which multiplies blur cost with window count.
blur-background-frame = false;

blur-background-exclude = [
    "class_g = 'slop'",
    "_GTK_FRAME_EXTENTS@:c"
];

#################################
#       General Settings        #
#################################
backend = "glx";
# vsync enabled — without it, picom can render more frames than the display
# shows, wasting GPU cycles. On modern GPUs this does not add noticeable
# latency for window management operations.
vsync = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
# refresh-rate = 0 lets picom auto-detect from the X server.
refresh-rate = 0;
# Damage tracking re-enabled (no-use-damage removed; default is false).
# This lets picom only repaint dirty regions instead of the whole screen
# every frame — a significant win during group switches.

#################################
#             Rules             #
#################################
# Animations file is no longer included — all animations have been removed
# to eliminate their contribution to perceived group-switch latency.
rules: (
	{
	blur-background = false;
	fade = false;
	},

	{
	match = "window_type = 'normal'";
	shadow = true;
	},

	{
	match = "window_type = 'dialog'";
	shadow = true;
	},

	{
	match = "window_type = 'tooltip'";
	corner-radius = 0;
	opacity = 0.90;
	},

{
    match = "fullscreen";
    corner-radius = 0;
},

{
    match = "window_type = 'dock'";
    corner-radius = 0;
},

{
    match = "window_type = 'dropdown_menu' || window_type = 'menu' || window_type = 'popup' || window_type = 'popup_menu'";
    corner-radius = 0;
},

{
    match = "window_type = 'menu' || role = 'popup' || role = 'bubble'";
    shadow = false;
},

{
    match = "class_g = 'Alacritty' || class_g = 'kitty' || class_g = 'FloaTerm'";
    opacity = 1.0;
    blur-background = false;
}
)
