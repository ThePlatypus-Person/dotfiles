#################################
#       Shadow Settings         #
#################################
shadow = true;
shadow-radius = 10;
shadow-offset-x = -10;
shadow-offset-y = -10;
shadow-color = "#000000";

#################################
#           Fading              #
#################################
# Disabled entirely — fading on map/unmap is a major contributor to
# perceived latency on group switches in Qtile.
fading = false;

#################################
#         Transparency          #
#################################
frame-opacity = 0.7;

#################################
#         Corner Radius         #
#################################
corner-radius = 7.0;
round-borders = 1;
round-borders-exclude = [];

#################################
#        Background Blur        #
#################################
# Kept dual_kawase (fastest blur picom offers) but reduced strength.
# Strength 10 was doing a lot of per-frame GPU work during redraws;
# 3 looks visually similar for most wallpapers and is dramatically cheaper.
blur: {
	  method = "dual_kawase";
	  strength = 3;
      };

blur-background = true;
# Disabled frame blur — this forces picom to blur the region behind every
# window frame separately, which multiplies blur cost with window count.
blur-background-frame = false;

#################################
#       General Settings        #
#################################
backend = "glx";
# vsync enabled — without it, picom can render more frames than the display
# shows, wasting GPU cycles. On modern GPUs this does not add noticeable
# latency for window management operations.
vsync = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;
# refresh-rate and mark-wmwin/ovredir-focused removed: these become no-ops
# once `rules` is in use, and were already being silently ignored.

#################################
#             Rules             #
#################################
# Animations file is no longer included — all animations have been removed
# to eliminate their contribution to perceived group-switch latency.
#
# inactive-opacity/active-opacity/inactive-opacity-override removed:
# both were set to 1 (fully opaque), i.e. already a no-op, and were being
# ignored anyway once `rules` was introduced.
rules: (
	{
	blur-background = false;
	fade = false;
	},

	{
	match = "window_type = 'normal'";
	shadow = true;
	},

	{
	match = "window_type = 'dialog'";
	shadow = true;
	},

	{
	match = "window_type = 'tooltip'";
	corner-radius = 0;
	opacity = 0.90;
	shadow = false;
	},

{
    match = "fullscreen";
    corner-radius = 0;
},

{
    match = "window_type = 'dock'";
    corner-radius = 0;
},

{
    match = "window_type = 'dropdown_menu' || window_type = 'menu' || window_type = 'popup' || window_type = 'popup_menu'";
    corner-radius = 0;
    shadow = false;
    opacity = 0.8;
},

{
    match = "window_type = 'menu' || role = 'popup' || role = 'bubble'";
    shadow = false;
},

{
    match = "class_g = 'Alacritty' || class_g = 'kitty' || class_g = 'FloaTerm' || class_g = 'XTerm' || class_g = 'URxvt' || class_g = 'code-oss' || class_g = 'Meld' || class_g = 'TelegramDesktop' || class_g = 'Thunderbird'";
    opacity = 1.0;
    blur-background = false;
},

{
    match = "class_g = 'st'";
    opacity = 0.70;
},

{
    match = "class_g = 'Bar' || class_g = 'Polybar'";
    opacity = 0.80;
    focused = true;
},

{
    match = "class_g = 'slop'";
    opacity = 1.0;
    focused = true;
    blur-background = false;
},

{
    match = "class_g = 'Joplin'";
    opacity = 0.90;
},

{
    match = "class_g = 'Cairo-clock'";
    focused = true;
},

{
    match = "class_g = 'awesome'";
    corner-radius = 0;
}
)
